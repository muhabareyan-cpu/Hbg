<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Hawli ❤️</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}


/* =====================================================
   PASSWORD
===================================================== */

.password-screen{

    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #351520 0%,
            #12070b 45%,
            #000 100%
        );

    z-index:100;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.password-screen.hide{

    opacity:0;

    transform:scale(1.12);

    pointer-events:none;
}

.password-box{

    width:100%;
    max-width:330px;

    padding:32px 24px;

    text-align:center;

    border-radius:26px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.7);

    animation:boxAppear 1s ease;
}

@keyframes boxAppear{

    from{
        opacity:0;
        transform:
            translateY(40px)
            scale(.9);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.heart{

    font-size:52px;

    margin-bottom:18px;

    animation:
        heartbeat 1.3s infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}

.password-box h1{

    font-size:23px;

    margin-bottom:9px;
}

.subtitle{

    color:#999;

    font-size:13px;

    line-height:1.6;

    margin-bottom:25px;
}

.password-input{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.password-input input{

    width:100%;

    height:54px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:16px;

    background:
        rgba(255,255,255,.08);

    color:white;

    padding:0 18px;

    font-size:15px;

    outline:none;

    text-align:center;
}

.password-input input::placeholder{

    color:#888;
}

.password-input button{

    width:100%;

    height:54px;

    border:none;

    border-radius:16px;

    background:#fff;

    color:#111;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition: all 0.3s ease;
}

.password-input button:hover{
    transform: scale(1.02);
    box-shadow: 0 5px 15px rgba(255,255,255,.3);
}

.error{

    min-height:18px;

    margin-top:14px;

    color:#ff6682;

    font-size:12px;
}


/* =====================================================
   UNLOCK
===================================================== */

.unlock-effect{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#000;

    opacity:0;

    pointer-events:none;

    z-index:200;
}

.unlock-effect.show{

    animation:
        unlockScreen
        2.2s
        forwards;
}

.unlock-heart{

    font-size:85px;

    animation:
        unlockHeart
        2.2s
        ease
        forwards;
}

@keyframes unlockScreen{

    0%{
        opacity:0;
    }

    20%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}

@keyframes unlockHeart{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    35%{
        opacity:1;
        transform:scale(1.2);
    }

    65%{
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(2);
    }
}


/* =====================================================
   HOME
===================================================== */

.home-screen{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px;

    opacity:0;

    transform:scale(.9);

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 40%,
            #351520,
            #10070b 48%,
            #000
        );

    z-index:20;
}

.home-screen.show{

    animation:
        homeAppear
        1.5s
        ease
        forwards;

    pointer-events:auto;
}

@keyframes homeAppear{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.home-heart{

    font-size:72px;

    margin-bottom:25px;

    animation:
        heartbeat
        1.5s
        infinite;
}

.home-title{

    font-size:35px;

    font-weight:700;

    margin-bottom:14px;
}

.home-subtitle{

    max-width:310px;

    color:#aaa;

    font-size:14px;

    line-height:1.8;
}

.start-button{

    margin-top:35px;

    padding:15px 32px;

    border:none;

    border-radius:50px;

    background:#fff;

    color:#111;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition: all 0.3s ease;
}

.start-button:hover{
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(255,255,255,.2);
}


/* =====================================================
   SUSPENSE INTRO
===================================================== */

.suspense{

    position:absolute;

    inset:0;

    background:#000;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    z-index:300;
}

.suspense.active{

    display:flex;
}

.suspense-small{

    color:#777;

    font-size:11px;

    letter-spacing:5px;

    text-transform:uppercase;

    opacity:0;

    animation:
        suspenseText
        2s
        forwards;
}

.suspense-title{

    margin-top:20px;

    font-size:28px;

    letter-spacing:2px;

    opacity:0;

    animation:
        suspenseTitle
        3s
        1.5s
        forwards;
}

.suspense-heart{

    margin-top:30px;

    font-size:35px;

    opacity:0;

    animation:
        suspenseHeart
        3s
        3s
        forwards;
}

@keyframes suspenseText{

    0%{
        opacity:0;
        transform:translateY(15px);
    }

    40%{
        opacity:1;
    }

    100%{
        opacity:.5;
        transform:translateY(0);
    }
}

@keyframes suspenseTitle{

    0%{
        opacity:0;
        transform:scale(.8);
        filter:blur(10px);
    }

    50%{
        opacity:1;
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes suspenseHeart{

    0%{
        opacity:0;
        transform:scale(.4);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:.7;
        transform:scale(1);
    }
}


/* =====================================================
   3D ROOM EXPLORER
===================================================== */

.room-container{
    position:absolute;
    inset:0;
    display:none;
    background:#1a0f12;
    z-index:50;
    overflow:hidden;
}

.room-container.active{
    display:block;
}

.room{
    width:100%;
    height:100%;
    position:relative;
    perspective:1200px;
    overflow:hidden;
}

.room-viewport{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
}

/* Room Walls */
.room-wall{
    position:absolute;
    inset:0;
}

.wall-front{
    width:100%;
    height:100%;
    background:linear-gradient(135deg, #2a1820 0%, #3d2530 50%, #2a1820 100%);
    transform:translateZ(600px);
}

.wall-back{
    width:100%;
    height:100%;
    background:linear-gradient(135deg, #1f1215 0%, #3a2230 50%, #1f1215 100%);
    transform:rotateY(180deg) translateZ(600px);
}

.wall-left{
    width:100%;
    height:100%;
    background:linear-gradient(90deg, #241419 0%, #3a2530 50%, #241419 100%);
    transform:rotateY(-90deg) translateZ(600px);
}

.wall-right{
    width:100%;
    height:100%;
    background:linear-gradient(90deg, #2a1820 0%, #3a2530 50%, #2a1820 100%);
    transform:rotateY(90deg) translateZ(600px);
}

.wall-floor{
    position:absolute;
    left:-20%;
    top:60%;
    width:140%;
    height:50%;
    background:repeating-linear-gradient(90deg, #1b1215 0px, #1b1215 55px, #281a1f 56px, #281a1f 110px);
    transform:rotateX(75deg) translateZ(100px);
    transform-origin:top;
}

/* Door in room */
.door-interior{
    position:absolute;
    left:5%;
    top:15%;
    width:150px;
    height:300px;
    background:linear-gradient(90deg, #27171c, #53313b, #24151a);
    border:6px solid #120b0d;
    box-shadow:0 20px 70px rgba(0,0,0,.8);
    transform:translateZ(585px);
}

.door-handle-interior{
    position:absolute;
    right:18px;
    top:52%;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#d8a66c;
    box-shadow:0 0 12px rgba(255,180,100,.5);
}

/* Photo Frames */
.photo-frame-3d{
    position:absolute;
    width:120px;
    height:160px;
    background:#b88a57;
    border:8px solid #8b6f47;
    box-shadow:0 15px 35px rgba(0,0,0,.8);
    overflow:hidden;
    opacity:0.8;
    transition:all 0.3s ease;
    cursor:pointer;
}

.photo-frame-3d img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-frame-3d:hover{
    opacity:1;
    box-shadow:0 0 40px rgba(255,200,150,.6);
    transform:scale(1.05);
}

.photo-frame-3d.enlarged{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%) scale(2);
    z-index:500;
    width:200px;
    height:260px;
}

/* Photo positions */
.photo-left-1{
    left:8%;
    top:25%;
    transform:translateZ(580px) rotateY(15deg);
}

.photo-left-2{
    left:2%;
    top:50%;
    transform:translateZ(575px) rotateY(25deg);
}

.photo-right-1{
    right:8%;
    top:25%;
    transform:translateZ(580px) rotateY(-15deg);
}

.photo-right-2{
    right:2%;
    top:50%;
    transform:translateZ(575px) rotateY(-25deg);
}

.photo-center-top{
    left:50%;
    top:15%;
    transform:translateX(-50%) translateZ(590px);
}

/* Controls */
.room-controls{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:100;
    font-size:12px;
    color:#aaa;
    text-align:center;
}

.control-btn{
    padding:12px 20px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3);
    border-radius:20px;
    color:#fff;
    cursor:pointer;
    transition:all 0.3s ease;
    font-weight:bold;
}

.control-btn:hover{
    background:rgba(255,255,255,.2);
    border-color:rgba(255,255,255,.6);
}

.movement-keys{
    position:absolute;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    opacity:0.6;
}

/* Photo Modal */
.photo-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:600;
    backdrop-filter:blur(10px);
}

.photo-modal.show{
    display:flex;
}

.photo-modal-content{
    position:relative;
    max-width:80vw;
    max-height:80vh;
}

.photo-modal-content img{
    width:100%;
    height:100%;
    object-fit:contain;
    border:15px solid #b88a57;
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    animation:photoZoom 0.5s ease forwards;
}

@keyframes photoZoom{
    from{
        opacity:0;
        transform:scale(0.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.photo-modal-close{
    position:absolute;
    top:-40px;
    right:0;
    font-size:40px;
    color:#fff;
    cursor:pointer;
    transition:all 0.3s ease;
}

.photo-modal-close:hover{
    color:#ff6682;
    transform:scale(1.2);
}

.photo-caption{
    position:absolute;
    bottom:-60px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    font-size:14px;
    text-align:center;
    width:100%;
}

/* Vignette */
.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.7) 100%);
    z-index:40;
}

/* HUD */
.room-hud{
    position:absolute;
    top:20px;
    left:20px;
    color:#ccc;
    font-size:14px;
    z-index:100;
    background:rgba(0,0,0,.5);
    padding:15px 20px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);
}

.crosshair{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:30px;
    height:30px;
    z-index:100;
    pointer-events:none;
}

.crosshair-h, .crosshair-v{
    position:absolute;
    background:#fff;
    opacity:0.5;
}

.crosshair-h{
    width:10px;
    height:1px;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
}

.crosshair-v{
    width:1px;
    height:10px;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
}

</style>

</head>

<body>

<div class="app">

    <!-- PASSWORD SCREEN -->
    <div class="password-screen" id="passwordScreen">
        <div class="password-box">
            <div class="heart">❤️</div>
            <h1>For My Hawli</h1>
            <p class="subtitle">Enter the password to see the surprise...</p>
            <div class="password-input">
                <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
                <button id="submitBtn">Unlock</button>
            </div>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <!-- UNLOCK EFFECT -->
    <div class="unlock-effect" id="unlockEffect">
        <div class="unlock-heart">❤️</div>
    </div>

    <!-- HOME SCREEN -->
    <div class="home-screen" id="homeScreen">
        <div class="home-heart">❤️</div>
        <h1 class="home-title">Welcome 💕</h1>
        <p class="home-subtitle">Let me take you somewhere special...</p>
        <button class="start-button" id="startBtn">Enter</button>
    </div>

    <!-- SUSPENSE INTRO -->
    <div class="suspense" id="suspense">
        <div class="suspense-small">Get ready...</div>
        <div class="suspense-title">Welcome to Our Room</div>
        <div class="suspense-heart">✨</div>
    </div>

    <!-- 3D ROOM EXPLORER -->
    <div class="room-container" id="roomContainer">
        <div class="room">
            <div class="room-viewport" id="roomViewport">
                
                <!-- Walls -->
                <div class="wall-front room-wall"></div>
                <div class="wall-back room-wall"></div>
                <div class="wall-left room-wall"></div>
                <div class="wall-right room-wall"></div>
                <div class="wall-floor"></div>

                <!-- Door -->
                <div class="door-interior">
                    <div class="door-handle-interior"></div>
                </div>

                <!-- Photos on Walls -->
                <div class="photo-frame-3d photo-left-1" data-photo="1" onclick="enlargePhoto(this)">
                    <img src="https://images.unsplash.com/photo-1544078751-58fee2d8a03b?w=300&h=400&fit=crop" alt="Photo 1">
                </div>

                <div class="photo-frame-3d photo-right-1" data-photo="2" onclick="enlargePhoto(this)">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=400&fit=crop" alt="Photo 2">
                </div>

                <div class="photo-frame-3d photo-center-top" data-photo="3" onclick="enlargePhoto(this)">
                    <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=300&h=400&fit=crop" alt="Photo 3">
                </div>

                <div class="photo-frame-3d photo-left-2" data-photo="4" onclick="enlargePhoto(this)">
                    <img src="https://images.unsplash.com/photo-1506755855726-81d46d407006?w=300&h=400&fit=crop" alt="Photo 4">
                </div>

                <div class="photo-frame-3d photo-right-2" data-photo="5" onclick="enlargePhoto(this)">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=300&h=400&fit=crop" alt="Photo 5">
                </div>

            </div>

            <!-- Vignette -->
            <div class="vignette"></div>

            <!-- HUD -->
            <div class="room-hud">
                <div>🖱️ Click photos to view</div>
                <div style="margin-top:8px; opacity:0.7;">Use arrow keys or WASD to explore</div>
            </div>

            <!-- Crosshair -->
            <div class="crosshair">
                <div class="crosshair-h"></div>
                <div class="crosshair-v"></div>
            </div>

            <!-- Controls -->
            <div class="room-controls">
                <button class="control-btn" onclick="moveCamera('left')">← Left</button>
                <button class="control-btn" onclick="moveCamera('right')">Right →</button>
                <button class="control-btn" onclick="moveCamera('up')">↑ Up</button>
                <button class="control-btn" onclick="moveCamera('down')">↓ Down</button>
                <button class="control-btn" onclick="rotateCamera('ccw')">↺ Rotate</button>
            </div>

            <div class="movement-keys">
                Use ⬆️ ⬅️ ⬇️ ➡️ or WASD to explore
            </div>
        </div>

        <!-- Photo Modal -->
        <div class="photo-modal" id="photoModal">
            <div class="photo-modal-content" id="photoModalContent">
                <img id="photoModalImage" src="" alt="Photo">
                <div class="photo-caption" id="photoCaption"></div>
                <span class="photo-modal-close" onclick="closePhoto()">✕</span>
            </div>
        </div>
    </div>

</div>

<script>

// =====================================================
// PASSWORD LOGIC
// =====================================================

const passwordScreen = document.getElementById('passwordScreen');
const passwordInput = document.getElementById('passwordInput');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');
const unlockEffect = document.getElementById('unlockEffect');
const homeScreen = document.getElementById('homeScreen');
const startBtn = document.getElementById('startBtn');

const CORRECT_PASSWORD = 'hawli';

submitBtn.addEventListener('click', () => {
    const entered = passwordInput.value.toLowerCase().trim();
    
    if (entered === CORRECT_PASSWORD) {
        errorMsg.textContent = '';
        unlockEffect.classList.add('show');
        
        setTimeout(() => {
            passwordScreen.classList.add('hide');
            homeScreen.classList.add('show');
        }, 1500);
    } else {
        errorMsg.textContent = 'Wrong password. Try again! 💔';
        passwordInput.value = '';
        passwordInput.focus();
    }
});

passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitBtn.click();
});

// =====================================================
// HOME SCREEN LOGIC
// =====================================================

startBtn.addEventListener('click', () => {
    homeScreen.classList.remove('show');
    
    const suspense = document.getElementById('suspense');
    suspense.classList.add('active');
    
    setTimeout(() => {
        suspense.classList.remove('active');
        initializeRoom();
    }, 7000);
});

// =====================================================
// 3D ROOM EXPLORER
// =====================================================

let roomState = {
    rotationX: 0,
    rotationY: 0,
    positionX: 0,
    positionY: 0,
    zoom: 1
};

function initializeRoom() {
    const roomContainer = document.getElementById('roomContainer');
    roomContainer.classList.add('active');
    setupControls();
}

function setupControls() {
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        
        if (key === 'arrowup' || key === 'w') moveCamera('forward');
        if (key === 'arrowdown' || key === 's') moveCamera('backward');
        if (key === 'arrowleft' || key === 'a') moveCamera('left');
        if (key === 'arrowright' || key === 'd') moveCamera('right');
    });
}

function moveCamera(direction) {
    const viewport = document.getElementById('roomViewport');
    const step = 30;
    
    switch(direction) {
        case 'left':
            roomState.positionX -= step;
            break;
        case 'right':
            roomState.positionX += step;
            break;
        case 'up':
            roomState.positionY -= step;
            break;
        case 'down':
            roomState.positionY += step;
            break;
        case 'forward':
            roomState.zoom += 0.05;
            break;
        case 'backward':
            roomState.zoom = Math.max(0.5, roomState.zoom - 0.05);
            break;
    }
    
    updateViewport(viewport);
}

function rotateCamera(direction) {
    const viewport = document.getElementById('roomViewport');
    const step = 10;
    
    if (direction === 'ccw') {
        roomState.rotationY -= step;
    } else {
        roomState.rotationY += step;
    }
    
    updateViewport(viewport);
}

function updateViewport(viewport) {
    const transform = `
        translateX(${roomState.positionX}px)
        translateY(${roomState.positionY}px)
        scale(${roomState.zoom})
        rotateX(${roomState.rotationX}deg)
        rotateY(${roomState.rotationY}deg)
    `;
    viewport.style.transform = transform;
}

// =====================================================
// PHOTO VIEWING
// =====================================================

const photoCaptions = {
    '1': 'Our first moment 💕',
    '2': 'Forever with you ✨',
    '3': 'Love never fades 💖',
    '4': 'You & Me 💑',
    '5': 'My beautiful memory 🌹'
};

function enlargePhoto(element) {
    const img = element.querySelector('img');
    const photoNum = element.getAttribute('data-photo');
    const modal = document.getElementById('photoModal');
    const modalImg = document.getElementById('photoModalImage');
    const caption = document.getElementById('photoCaption');
    
    modalImg.src = img.src;
    caption.textContent = photoCaptions[photoNum];
    modal.classList.add('show');
}

function closePhoto() {
    document.getElementById('photoModal').classList.remove('show');
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closePhoto();
    }
});

document.getElementById('photoModal').addEventListener('click', (e) => {
    if (e.target.id === 'photoModal') {
        closePhoto();
    }
});

// Focus password input on load
window.addEventListener('load', () => {
    passwordInput.focus();
});

</script>

</body>
